name: on_device_training_sandbox
description: Train machine learning models directly on ARM mobile devices with on-device training, real-time visualization, and ARM NEON SIMD optimizations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  fl_chart: ^6.1.1
  provider: ^6.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  image: ^4.0.0
  tflite_flutter: ^0.10.0
  ffi: ^2.1.0
  path_provider: ^2.1.0
  share_plus: ^7.0.0
  permission_handler: ^11.4.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/datasets/
    - assets/tutorials/
    - assets/models/
